name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS: Apple Vision (ocrmac) and MLX are macOS-only. Hosted runners have no
    # Metal GPU, so real-OCR tests (marker "ocr") are deselected.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -m "not ocr" -v
